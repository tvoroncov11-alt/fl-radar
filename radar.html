<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FL.ru — Радар заказов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090A0F;
    --card:#12151E;
    --card2:#171B26;
    --border:#232838;
    --border2:#2E3547;
    --text:#E7EAF0;
    --muted:#8A93A6;
    --muted2:#5C6577;
    --accent:#5B8CFF;
    --accent2:#3AD29F;
    --danger:#FF5D6C;
    --warn:#FFC24B;
    --radius:16px;
    --radius-sm:11px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    padding:0 0 40px;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(91,140,255,.35)}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;}

  /* Scrollbar */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#242A38;border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}

  header{
    position:sticky;top:0;z-index:40;
    backdrop-filter:blur(14px);
    background:rgba(9,10,15,.82);
    border-bottom:1px solid var(--border);
  }
  .head-inner{max-width:1180px;margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:.2px}
  .brand .logo{width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-size:15px;box-shadow:0 0 18px rgba(91,140,255,.45)}
  .brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.6px;text-transform:uppercase}

  .live{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);
    background:var(--card);border:1px solid var(--border);border-radius:999px;padding:6px 12px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent2);
    box-shadow:0 0 10px var(--accent2);animation:pulse 1.4s infinite}
  .dot.paused{background:var(--muted2);box-shadow:none;animation:none}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}

  .stats{display:flex;gap:8px;margin-left:auto}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:6px 12px;min-width:72px;text-align:center}
  .stat .v{font-size:15px;font-weight:700;color:var(--text)}
  .stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

  .icon-btn{background:var(--card);border:1px solid var(--border);color:var(--text);
    width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:15px;
    display:grid;place-items:center;transition:.15s}
  .icon-btn:hover{background:var(--card2);border-color:var(--border2)}
  .btn{background:var(--card2);color:var(--text);border:1px solid var(--border);
    border-radius:11px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
  .btn:hover{background:#1f2533;border-color:var(--border2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:#4a7bf0}

  .wrap{max-width:1180px;margin:0 auto;padding:18px 20px 0}

  /* Categories */
  .cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .cat-chip{background:var(--card);border:1px solid var(--border);color:var(--muted);
    padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:500;cursor:pointer;transition:.15s;
    user-select:none}
  .cat-chip:hover{color:var(--text);border-color:var(--border2)}
  .cat-chip.on{background:rgba(91,140,255,.14);border-color:var(--accent);color:#fff;
    box-shadow:0 0 0 1px rgba(91,140,255,.25) inset}

  /* Filters */
  .filters{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:18px 26px;align-items:center}
  .fgroup{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .fgroup label{color:var(--text);font-weight:500}
  .switch{position:relative;width:40px;height:22px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#2a3040;border-radius:999px;transition:.2s;cursor:pointer}
  .slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;
    background:#8A93A6;border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:var(--accent)}
  .switch input:checked + .slider:before{transform:translateX(18px);background:#fff}

  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;
    background:#2a3040;width:130px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--accent);cursor:pointer;box-shadow:0 0 8px rgba(91,140,255,.6)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;
    background:var(--accent);cursor:pointer}

  select,input[type=number],input[type=text],input[type=password]{
    background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:9px;padding:7px 10px;font-size:13px;font-family:inherit;outline:none;transition:.15s}
  select:focus,input:focus{border-color:var(--accent)}
  select{cursor:pointer}

  .minbudget{color:var(--accent2);font-weight:600;min-width:64px}

  /* Stopwords */
  .stopwords{display:flex;flex-direction:column;gap:8px;flex:1 1 320px;min-width:260px}
  .stopwords .row{display:flex;gap:8px}
  #wordInput{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;max-height:84px;overflow:auto}
  .chip{background:var(--bg);border:1px solid var(--border);border-radius:20px;
    padding:3px 5px 3px 10px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
  .chip b{color:var(--text);font-weight:500}
  .chip .x{cursor:pointer;color:var(--muted);font-weight:700;padding:0 4px;border-radius:50%}
  .chip .x:hover{color:var(--danger);background:#2a1b1e}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 16px 14px;cursor:pointer;transition:.16s;position:relative;
    display:flex;flex-direction:column;gap:8px;overflow:hidden}
  .card:before{content:"";position:absolute;inset:0;border-radius:var(--radius);
    background:radial-gradient(120% 80% at 0% 0%,rgba(91,140,255,.08),transparent 55%);pointer-events:none}
  .card:hover{border-color:var(--border2);transform:translateY(-2px);
    box-shadow:0 10px 30px -12px rgba(0,0,0,.7)}
  .card.new{animation:flash 1.4s ease}
  @keyframes flash{0%{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2),0 0 26px rgba(58,210,159,.35)}100%{}}
  .card.fav{border-color:rgba(255,194,75,.5)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .cat-badge{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
    color:var(--accent);background:rgba(91,140,255,.12);border:1px solid rgba(91,140,255,.25);
    padding:3px 9px;border-radius:999px}
  .card-actions{display:flex;gap:4px}
  .mini{background:transparent;border:none;color:var(--muted2);cursor:pointer;font-size:15px;
    width:28px;height:28px;border-radius:8px;display:grid;place-items:center;transition:.15s}
  .mini:hover{background:var(--card2);color:var(--text)}
  .mini.star.on{color:var(--warn)}
  .card h3{margin:0;font-size:14.5px;font-weight:600;line-height:1.4;padding-right:4px}
  .budget{font-size:14.5px;font-weight:700;color:var(--accent2);display:flex;align-items:center;gap:6px}
  .budget.empty{color:var(--muted);font-weight:500;font-size:13px}
  .desc{color:var(--muted);font-size:12.8px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card-foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:6px;
    border-top:1px solid var(--border);font-size:11.5px;color:var(--muted2)}
  .card-foot .replies{color:var(--muted)}
  .card-foot .time{margin-left:auto}
  .ai-btn{background:rgba(91,140,255,.12);border:1px solid rgba(91,140,255,.3);color:#cdd9ff;
    border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
  .ai-btn:hover{background:rgba(91,140,255,.22)}
  .ai-btn.prop{background:rgba(58,210,159,.12);border-color:rgba(58,210,159,.3);color:#bdf5e2}
  .ai-btn.prop:hover{background:rgba(58,210,159,.22)}

  .empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:60px;font-size:14px}

  /* Drawer */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:.25s;z-index:60}
  .overlay.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,94vw);background:var(--card);
    border-left:1px solid var(--border);z-index:70;transform:translateX(102%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0)}
  .drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
  .drawer-head h2{margin:0;font-size:17px;line-height:1.35;flex:1}
  .drawer-body{padding:18px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
  .drawer-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
  .kv{display:flex;flex-direction:column;gap:10px}
  .kv-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:9px 12px;
    background:var(--card2);border:1px solid var(--border);border-radius:10px}
  .kv-row .k{color:var(--muted)}
  .kv-row .val{font-weight:600;text-align:right}
  .kv-row .val.green{color:var(--accent2)}
  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}
  .full-desc{font-size:13.5px;line-height:1.6;color:#cdd3df;white-space:pre-wrap;
    background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;max-height:none}
  .ai-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;
    font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:#dbe2ef;position:relative}
  .ai-box .copy{position:absolute;top:8px;right:8px}
  .ai-actions{display:flex;gap:8px;flex-wrap:wrap}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
    display:none;place-items:center;z-index:90;padding:20px}
  .modal-bg.show{display:grid}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:18px;
    width:min(480px,100%);padding:22px;display:flex;flex-direction:column;gap:16px;max-height:90vh;overflow:auto}
  .modal h2{margin:0;font-size:18px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
  .hint{font-size:11.5px;color:var(--muted2)}

  /* Toast */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120%);
    background:var(--card2);border:1px solid var(--border2);color:var(--text);
    padding:11px 18px;border-radius:12px;font-size:13px;z-index:120;transition:.3s;box-shadow:0 10px 30px -8px #000}
  .toast.show{transform:translateX(-50%) translateY(0)}

  @media(max-width:640px){
    .stats{display:none}
    .head-inner{gap:10px}
  }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="brand">
      <div class="logo">⚡</div>
      <div>FL.RADAR<br><small>мониторинг заказов</small></div>
    </div>
    <div class="live"><span class="dot" id="liveDot"></span><span id="liveText">Онлайн • Проверка каждые 7 сек</span></div>

    <div class="stats">
      <div class="stat"><div class="v mono" id="todayCount">0</div><div class="l">сегодня</div></div>
      <div class="stat"><div class="v mono" id="totalCount">0</div><div class="l">всего</div></div>
    </div>

    <button class="icon-btn" id="testBtn" title="Тест звука и пуша">🔔</button>
    <button class="icon-btn" id="settingsBtn" title="Настройки">⚙️</button>
    <button class="btn" id="pauseBtn">Пауза</button>
  </div>
</header>

<div class="wrap">
  <div class="cats" id="cats"></div>

  <div class="filters">
    <div class="fgroup">
      <div class="switch"><input type="checkbox" id="onlyBudget"><span class="slider"></span></div>
      <label for="onlyBudget">Только с бюджетом</label>
    </div>

    <div class="fgroup">
      <label>Мин. бюджет</label>
      <input type="range" id="minBudget" min="0" max="300000" step="5000" value="0">
      <span class="minbudget mono" id="minBudgetVal">0 ₽</span>
    </div>

    <div class="fgroup">
      <label>Макс. откликов</label>
      <select id="maxReplies">
        <option value="0">Любое</option>
        <option value="3">до 3</option>
        <option value="5">до 5</option>
        <option value="10">до 10</option>
        <option value="20">до 20</option>
        <option value="50">до 50</option>
      </select>
    </div>

    <div class="stopwords">
      <div class="row">
        <input id="wordInput" type="text" placeholder="Стоп-слово и Enter…">
        <button class="btn" id="addWordBtn">+ Добавить</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div class="grid" id="grid">
    <div class="empty">Загрузка…</div>
  </div>
</div>

<!-- Drawer -->
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="dTitle">Заказ</h2>
    <button class="icon-btn" id="dClose">✕</button>
  </div>
  <div class="drawer-body" id="dBody"></div>
  <div class="drawer-foot" id="dFoot"></div>
</div>

<!-- Settings modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>⚙️ Настройки ИИ</h2>
    <div class="field">
      <label>Провайдер</label>
      <select id="aiProvider">
        <option value="pollinations">Pollinations (бесплатно, без ключа)</option>
        <option value="openrouter">OpenRouter</option>
        <option value="groq">Groq</option>
        <option value="deepseek">DeepSeek</option>
        <option value="gemini">Google Gemini</option>
        <option value="custom">Свой (OpenAI-совместимый)</option>
      </select>
    </div>
    <div class="field">
      <label>Base URL</label>
      <input type="text" id="aiBaseUrl" placeholder="https://api.openai.com/v1">
    </div>
    <div class="field">
      <label>Модель</label>
      <input type="text" id="aiModel" placeholder="gpt-4o-mini">
    </div>
    <div class="field">
      <label>API-ключ</label>
      <input type="password" id="aiKey" placeholder="sk-…">
      <span class="hint">Хранится локально в config.json на сервере.</span>
    </div>
    <div class="modal-actions">
      <button class="btn" id="aiCancel">Отмена</button>
      <button class="btn primary" id="aiSave">Сохранить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "/api/orders";
let paused = false;
let knownIds = new Set();
let firstLoad = true;
let pollTimer = null;

let orders = [];
let categories = [];
let lastNewIds = new Set();
let settings = { stopwords: [], categories: [], ai: {} };
let providers = {};

const filters = load("flradar_filters", { onlyBudget:false, minBudget:0, maxReplies:0 });
const favorites = new Set(load("flradar_fav", []));
const hidden = new Set(load("flradar_hidden", []));

const gridEl = document.getElementById("grid");
const catsEl = document.getElementById("cats");
const chipsEl = document.getElementById("chips");
const wordInput = document.getElementById("wordInput");
const pauseBtn = document.getElementById("pauseBtn");
const liveDot = document.getElementById("liveDot");
const liveText = document.getElementById("liveText");
const todayCountEl = document.getElementById("todayCount");
const totalCountEl = document.getElementById("totalCount");

/* ---------- utils ---------- */
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function budgetValue(b){
  if(!b) return null;
  if(/договоренности/i.test(b)) return null;
  const m = (b+"").replace(/\s/g,"").match(/(\d[\d]*)/);
  return m ? parseInt(m[1],10) : null;
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---------- sound ---------- */
let audioCtx = null;
function initAudio(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function beep(){
  initAudio(); if(!audioCtx) return;
  const now = audioCtx.currentTime;
  [880, 1174, 1568].forEach((f,i)=>{
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = f;
    const t = now + i*0.09;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.16,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t+0.36);
  });
}

/* ---------- notifications ---------- */
function askNotify(){
  if("Notification" in window && Notification.permission === "default") Notification.requestPermission();
}
function notify(order){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  try{
    const n = new Notification("Новый заказ FL.ru", {
      body: `${order.title}\n💰 ${order.budget || "По договоренности"}`,
      tag: "fl-"+order.id,
    });
    n.onclick = ()=>{ window.open(order.url, "_blank"); n.close(); };
  }catch(e){}
}

/* ---------- settings ---------- */
async function loadCategories(){
  try{ categories = await (await fetch("/api/categories")).json(); }catch(e){ categories = []; }
  renderCats();
}
async function loadSettings(){
  try{
    settings = await (await fetch("/api/settings")).json();
    renderChips(settings.stopwords || []);
    document.getElementById("aiProvider").value = settings.ai?.provider || "openrouter";
    document.getElementById("aiBaseUrl").value = settings.ai?.base_url || "";
    document.getElementById("aiModel").value = settings.ai?.model || "";
    document.getElementById("aiKey").value = settings.ai?.api_key || "";
  }catch(e){ console.error(e); }
}
async function saveSettings(patch){
  try{
    await fetch("/api/settings", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(patch)
    });
  }catch(e){ console.error(e); }
}

/* ---------- categories ---------- */
function renderCats(){
  catsEl.innerHTML = "";
  categories.forEach(c=>{
    const on = (settings.categories||[]).includes(c.id);
    const el = document.createElement("div");
    el.className = "cat-chip" + (on ? " on" : "");
    el.textContent = c.name;
    el.onclick = ()=>{
      const sel = new Set(settings.categories || []);
      if(sel.has(c.id)) sel.delete(c.id); else sel.add(c.id);
      if(sel.size === 0){ toast("Нужна хотя бы одна категория"); return; }
      settings.categories = [...sel];
      renderCats();
      saveSettings({ categories: settings.categories });
      knownIds = new Set(); firstLoad = true;
      refresh();
    };
    catsEl.appendChild(el);
  });
}

/* ---------- stopwords ---------- */
function renderChips(words){
  chipsEl.innerHTML = "";
  (words||[]).forEach(w=>{
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `<b></b><span class="x">×</span>`;
    chip.querySelector("b").textContent = w;
    chip.querySelector(".x").onclick = ()=> removeWord(w);
    chipsEl.appendChild(chip);
  });
}
async function addWord(){
  const w = wordInput.value.trim();
  if(!w) return;
  const words = [...(settings.stopwords||[])];
  if(!words.some(x=>x.toLowerCase()===w.toLowerCase())){
    words.push(w);
    settings.stopwords = words;
    renderChips(words);
    await saveSettings({ stopwords: words });
    await refresh();
  }
  wordInput.value = ""; wordInput.focus();
}
async function removeWord(w){
  const words = (settings.stopwords||[]).filter(x=>x!==w);
  settings.stopwords = words;
  renderChips(words);
  await saveSettings({ stopwords: words });
  await refresh();
}
document.getElementById("addWordBtn").onclick = addWord;
wordInput.addEventListener("keydown", e=>{ if(e.key==="Enter") addWord(); });

/* ---------- filters ---------- */
const elOnlyBudget = document.getElementById("onlyBudget");
const elMinBudget = document.getElementById("minBudget");
const elMinBudgetVal = document.getElementById("minBudgetVal");
const elMaxReplies = document.getElementById("maxReplies");

function syncFilterUI(){
  elOnlyBudget.checked = filters.onlyBudget;
  elMinBudget.value = filters.minBudget;
  elMinBudgetVal.textContent = filters.minBudget.toLocaleString("ru-RU") + " ₽";
  elMaxReplies.value = filters.maxReplies;
}
function persistFilters(){ save("flradar_filters", filters); }
elOnlyBudget.onchange = ()=>{ filters.onlyBudget = elOnlyBudget.checked; persistFilters(); render(); };
elMinBudget.oninput = ()=>{ filters.minBudget = +elMinBudget.value; elMinBudgetVal.textContent = filters.minBudget.toLocaleString("ru-RU")+" ₽"; persistFilters(); render(); };
elMaxReplies.onchange = ()=>{ filters.maxReplies = +elMaxReplies.value; persistFilters(); render(); };

/* ---------- rendering ---------- */
function visibleOrders(){
  return orders.filter(o=>{
    if(hidden.has(o.id)) return false;
    if(filters.onlyBudget && !budgetValue(o.budget)) return false;
    if(filters.minBudget > 0){
      const v = budgetValue(o.budget);
      if(v === null || v < filters.minBudget) return false;
    }
    if(filters.maxReplies > 0 && o.replies != null && o.replies > filters.maxReplies) return false;
    return true;
  });
}
function render(){
  const vis = visibleOrders();
  vis.sort((a,b)=>{
    const fa = favorites.has(a.id)?1:0, fb = favorites.has(b.id)?1:0;
    if(fa !== fb) return fb-fa;
    return (b.first_seen||"").localeCompare(a.first_seen||"");
  });

  const d = new Date();
  const today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  todayCountEl.textContent = orders.filter(o=>(o.first_seen||"").slice(0,10) === today).length;
  totalCountEl.textContent = orders.length;

  if(!vis.length){
    gridEl.innerHTML = `<div class="empty">Ничего не найдено по текущим фильтрам</div>`;
    return;
  }
  gridEl.innerHTML = "";
  vis.forEach(o=>{
    const isFav = favorites.has(o.id);
    const bval = budgetValue(o.budget);
    const card = document.createElement("div");
    card.className = "card" + (isFav?" fav":"") + (lastNewIds.has(o.id) ? " new" : "");
    card.innerHTML = `
      <div class="card-top">
        <span class="cat-badge">${esc(o.category||"FL.ru")}</span>
        <div class="card-actions">
          <button class="mini star ${isFav?'on':''}" data-act="fav" title="Избранное">${isFav?'★':'☆'}</button>
          <button class="mini" data-act="hide" title="Скрыть">✕</button>
        </div>
      </div>
      <h3>${esc(o.title)}</h3>
      <div class="budget ${bval?'':'empty'}">${bval? '💰 '+esc(o.budget) : 'По договоренности'}</div>
      <div class="desc">${esc(o.description||"")}</div>
      <div class="card-foot">
        <span class="replies">💬 ${o.replies!=null? o.replies : "—"}</span>
        <span class="time mono">${esc((o.first_seen||"").slice(11,16))}</span>
        <button class="ai-btn" data-act="sum">⚡ Суть</button>
        <button class="ai-btn prop" data-act="prop">✍️ Отклик</button>
      </div>`;

    card.addEventListener("click", (e)=>{
      const act = e.target.closest("[data-act]")?.dataset.act;
      if(act === "fav"){ e.stopPropagation(); toggleFav(o.id); return; }
      if(act === "hide"){ e.stopPropagation(); toggleHide(o.id); return; }
      if(act === "sum"){ e.stopPropagation(); openDrawer(o, "sum"); return; }
      if(act === "prop"){ e.stopPropagation(); openDrawer(o, "prop"); return; }
      openDrawer(o);
    });
    gridEl.appendChild(card);
  });
}

function toggleFav(id){
  if(favorites.has(id)) favorites.delete(id); else favorites.add(id);
  save("flradar_fav", [...favorites]);
  fetch("/api/favorite", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ id:String(id), value: favorites.has(id) }) });
  render();
}
function toggleHide(id){
  hidden.add(id); save("flradar_hidden", [...hidden]);
  fetch("/api/hidden", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ id:String(id), value: true }) });
  render();
  toast("Заказ скрыт");
}

/* ---------- drawer ---------- */
const drawer = document.getElementById("drawer");
const overlay = document.getElementById("overlay");
const dTitle = document.getElementById("dTitle");
const dBody = document.getElementById("dBody");
const dFoot = document.getElementById("dFoot");
let currentOrder = null;

function openDrawer(order, aiType){
  currentOrder = order;
  dTitle.textContent = order.title;
  dBody.innerHTML = `<div class="section-title">Загрузка деталей…</div>`;
  dFoot.innerHTML = `
    <a class="btn primary" href="${esc(order.url)}" target="_blank" rel="noopener">Открыть на FL.ru ↗</a>
    <button class="btn" id="dFav">${favorites.has(order.id)?'★ В избранном':'☆ Избранное'}</button>`;
  document.getElementById("dFav").onclick = ()=>{ toggleFav(order.id); openDrawer(order); };

  overlay.classList.add("show"); drawer.classList.add("show");

  fetch("/api/order_details?url="+encodeURIComponent(order.url))
    .then(r=>r.json())
    .then(d=>{
      if(d.error){ dBody.innerHTML = `<div class="section-title" style="color:var(--danger)">${esc(d.error)}</div>`; return; }
      renderDetails(order, d);
      if(aiType) runAI(order, aiType);
    })
    .catch(e=>{ dBody.innerHTML = `<div class="section-title" style="color:var(--danger)">Ошибка загрузки</div>`; });
}
function closeDrawer(){
  overlay.classList.remove("show"); drawer.classList.remove("show"); currentOrder = null;
}
overlay.onclick = closeDrawer;
document.getElementById("dClose").onclick = closeDrawer;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeDrawer(); });

function renderDetails(order, d){
  const c = d.customer || {};
  dBody.innerHTML = `
    <div class="kv">
      <div class="kv-row"><span class="k">Бюджет</span><span class="val green">${esc(d.budget || order.budget || "По договоренности")}</span></div>
      <div class="kv-row"><span class="k">Отклики</span><span class="val mono">${d.replies!=null? d.replies : (order.replies!=null?order.replies:"—")}</span></div>
      ${d.published?`<div class="kv-row"><span class="k">Опубликован</span><span class="val mono">${esc(d.published)}</span></div>`:""}
      <div class="kv-row"><span class="k">Заказчик</span><span class="val">${esc(c.name||"—")}</span></div>
      ${c.registered?`<div class="kv-row"><span class="k">Регистрация</span><span class="val">${esc(c.registered)}</span></div>`:""}
      ${c.reviews!=null?`<div class="kv-row"><span class="k">Отзывы</span><span class="val">${c.reviews}${c.rating?` · ★ ${esc(c.rating)}`:""}</span></div>`:""}
      ${d.safe_deal?`<div class="kv-row"><span class="k">Сделка</span><span class="val green">🛡 Безопасная сделка</span></div>`:""}
    </div>
    <div class="section-title">Полное описание</div>
    <div class="full-desc">${esc(d.description || order.description || "")}</div>
    <div class="section-title">ИИ-помощник</div>
    <div class="ai-actions">
      <button class="ai-btn" id="dSum">⚡ Суть за 3 сек</button>
      <button class="ai-btn prop" id="dProp">✍️ Сгенерировать отклик</button>
    </div>
    <div id="aiResult"></div>`;
  document.getElementById("dSum").onclick = ()=> runAI(currentOrder, "sum");
  document.getElementById("dProp").onclick = ()=> runAI(currentOrder, "prop");
}

async function runAI(order, type){
  const box = document.getElementById("aiResult");
  if(!box) return;
  box.innerHTML = `<div class="ai-box">⏳ Думаю…</div>`;
  const ep = type === "sum" ? "/api/ai/summarize" : "/api/ai/proposal";
  try{
    const r = await fetch(ep, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(order) });
    const d = await r.json();
    if(d.error){ box.innerHTML = `<div class="ai-box" style="color:var(--danger)">${esc(d.error)}</div>`; return; }
    box.innerHTML = `<div class="ai-box">${esc(d.text)}
      <button class="ai-btn copy" id="copyAi">📋 Скопировать</button></div>`;
    document.getElementById("copyAi").onclick = ()=>{
      navigator.clipboard.writeText(d.text).then(()=>toast("Скопировано"));
    };
  }catch(e){
    box.innerHTML = `<div class="ai-box" style="color:var(--danger)">Ошибка запроса</div>`;
  }
}

/* ---------- polling ---------- */
async function refresh(){
  try{
    const data = await (await fetch(API)).json();
    orders = data.orders || [];
    const newIds = new Set();
    if(!firstLoad){
      orders.forEach(o=>{ if(!knownIds.has(o.id)) newIds.add(o.id); });
    }
    if(newIds.size > 0){
      beep();
      orders.filter(o=>newIds.has(o.id)).slice(0,5).forEach(notify);
    }
    orders.forEach(o=>knownIds.add(o.id));
    lastNewIds = newIds;
    firstLoad = false;
    render();
  }catch(e){ console.error("refresh error", e); }
}
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refresh, 3000);
}
function stopPolling(){ if(pollTimer) clearInterval(pollTimer); pollTimer = null; }

/* ---------- pause ---------- */
pauseBtn.onclick = ()=>{
  paused = !paused;
  pauseBtn.textContent = paused ? "Старт" : "Пауза";
  liveDot.classList.toggle("paused", paused);
  liveText.textContent = paused ? "Пауза" : "Онлайн • Проверка каждые 7 сек";
  if(paused) stopPolling(); else { refresh(); startPolling(); }
};

/* ---------- settings modal ---------- */
const modalBg = document.getElementById("modalBg");
document.getElementById("settingsBtn").onclick = ()=>{
  document.getElementById("aiProvider").value = settings.ai?.provider || "openrouter";
  document.getElementById("aiBaseUrl").value = settings.ai?.base_url || "";
  document.getElementById("aiModel").value = settings.ai?.model || "";
  document.getElementById("aiKey").value = settings.ai?.api_key || "";
  modalBg.classList.add("show");
};
document.getElementById("aiCancel").onclick = ()=> modalBg.classList.remove("show");
modalBg.onclick = (e)=>{ if(e.target === modalBg) modalBg.classList.remove("show"); };

document.getElementById("aiProvider").onchange = (e)=>{
  const p = e.target.value;
  const base = document.getElementById("aiBaseUrl");
  const model = document.getElementById("aiModel");
  const key = document.getElementById("aiKey");
  if(providers[p]){ base.value = providers[p].base_url; model.value = providers[p].model; }
  if(p === "pollinations"){ key.value = "free"; }
};
document.getElementById("aiSave").onclick = async ()=>{
  settings.ai = {
    provider: document.getElementById("aiProvider").value,
    base_url: document.getElementById("aiBaseUrl").value.trim(),
    model: document.getElementById("aiModel").value.trim(),
    api_key: document.getElementById("aiKey").value.trim(),
  };
  await saveSettings({ ai: settings.ai });
  modalBg.classList.remove("show");
  toast("Настройки ИИ сохранены");
};

/* ---------- test ---------- */
document.getElementById("testBtn").onclick = ()=>{
  beep();
  if("Notification" in window && Notification.permission === "granted"){
    new Notification("Тест радара", { body: "Звук и пуш работают. Следите за новыми заказами 🔔" });
  }else{
    askNotify();
    toast("Разрешите уведомления в браузере");
  }
};

/* ---------- init ---------- */
document.addEventListener("click", initAudio, {once:true});
document.addEventListener("keydown", initAudio, {once:true});

(async function init(){
  syncFilterUI();
  try{ providers = await (await fetch("/api/providers")).json(); }catch(e){}
  await loadCategories();
  await loadSettings();
  try{
    const st = await (await fetch("/api/state")).json();
    favorites.clear(); (st.favorites||[]).forEach(x=>favorites.add(String(x)));
    hidden.clear(); (st.hidden||[]).forEach(x=>hidden.add(String(x)));
  }catch(e){}
  askNotify();
  refresh();
  startPolling();
})();
</script>
</body>
